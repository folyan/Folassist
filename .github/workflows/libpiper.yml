name: libpiper

on:
  workflow_dispatch:

jobs:
  libpiper-x86_64-glibc:
    runs-on: ubuntu-24.04
    steps:
      - name: install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq build-essential cmake ninja-build git pkg-config
      - name: clone piper
        run: git clone --depth 1 https://github.com/OHF-voice/piper1-gpl.git piper
      - name: configure
        run: cmake -S piper/libpiper -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/prefix"
      - name: build
        run: cmake --build build -j"$(nproc)"
      - name: install
        run: cmake --install build
      - uses: actions/upload-artifact@v4
        with:
          name: libpiper-x86_64-glibc
          path: prefix

  libpiper-aarch64-glibc:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq build-essential cmake ninja-build git pkg-config
      - name: clone piper
        run: git clone --depth 1 https://github.com/OHF-voice/piper1-gpl.git piper
      - name: configure
        run: cmake -S piper/libpiper -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/prefix"
      - name: build
        run: cmake --build build -j"$(nproc)"
      - name: install
        run: cmake --install build
      - uses: actions/upload-artifact@v4
        with:
          name: libpiper-aarch64-glibc
          path: prefix

  libpiper-x86_64-musl:
    runs-on: ubuntu-24.04
    container: alpine:edge
    steps:
      - name: install tools
        run: apk add --no-cache bash build-base cmake ninja git pkgconf onnxruntime
      - name: check onnxruntime files
        run: ls /usr/lib | grep -i onnx || true
      - name: prepare onnxruntime dir
        run: |
          VER=$(apk list -I onnxruntime | awk '{print $1}' | sed 's/^onnxruntime-//; s/-r[0-9]*$//')
          echo "onnxruntime version: $VER"
          mkdir -p ort/lib ort/include
          cp -P /usr/lib/libonnxruntime*.so* ort/lib/
          ln -sf libonnxruntime.so.1 ort/lib/libonnxruntime.so
          git clone --depth 1 --filter=blob:none --sparse --branch "v$VER" https://github.com/microsoft/onnxruntime src-ort
          git -C src-ort sparse-checkout set include
          cp -r src-ort/include/onnxruntime/* ort/include/
      - name: clone piper
        run: git clone --depth 1 https://github.com/OHF-voice/piper1-gpl.git piper
      - name: configure
        run: cmake -S piper/libpiper -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/prefix" -DONNXRUNTIME_DIR="$PWD/ort"
      - name: build
        run: cmake --build build -j"$(nproc)"
      - name: install
        run: cmake --install build
      - uses: actions/upload-artifact@v4
        with:
          name: libpiper-x86_64-musl
          path: prefix

  libpiper-aarch64-musl:
    runs-on: ubuntu-24.04-arm
    container: alpine:edge
    steps:
      - name: install tools
        run: apk add --no-cache bash build-base cmake ninja git pkgconf onnxruntime
      - name: check onnxruntime files
        run: ls /usr/lib | grep -i onnx || true
      - name: prepare onnxruntime dir
        run: |
          VER=$(apk list -I onnxruntime | awk '{print $1}' | sed 's/^onnxruntime-//; s/-r[0-9]*$//')
          echo "onnxruntime version: $VER"
          mkdir -p ort/lib ort/include
          cp -P /usr/lib/libonnxruntime*.so* ort/lib/
          ln -sf libonnxruntime.so.1 ort/lib/libonnxruntime.so
          git clone --depth 1 --filter=blob:none --sparse --branch "v$VER" https://github.com/microsoft/onnxruntime src-ort
          git -C src-ort sparse-checkout set include
          cp -r src-ort/include/onnxruntime/* ort/include/
      - name: clone piper
        run: git clone --depth 1 https://github.com/OHF-voice/piper1-gpl.git piper
      - name: configure
        run: cmake -S piper/libpiper -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/prefix" -DONNXRUNTIME_DIR="$PWD/ort"
      - name: build
        run: cmake --build build -j"$(nproc)"
      - name: install
        run: cmake --install build
      - uses: actions/upload-artifact@v4
        with:
          name: libpiper-aarch64-musl
          path: prefix
